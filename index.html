<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Training Form</title>
<script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
  :root { --bg:#f5f6f8; --card:#fff; --text:#1a1d21; --muted:#6b7280; --accent:#1a7f5a; --err:#c0392b; --border:#e3e5e8; }
  @media (prefers-color-scheme: dark) { :root { --bg:#111315; --card:#1b1e21; --text:#eceef0; --muted:#9aa1a9; --border:#2c3035; } }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,-apple-system,sans-serif; background:var(--bg); color:var(--text); }
  main { max-width:520px; margin:0 auto; padding:16px; }
  h1 { font-size:20px; margin:4px 0 12px; display:flex; justify-content:space-between; align-items:center; gap:8px; }
  .card { background:var(--card); border:1px solid var(--border); border-radius:14px; padding:14px; margin-bottom:12px; }
  #reader { width:100%; border-radius:10px; overflow:hidden; }
  button { font:inherit; border:0; border-radius:10px; padding:12px 16px; background:var(--accent); color:#fff; font-weight:600; width:100%; }
  button.ghost { background:transparent; color:var(--muted); border:1px solid var(--border); width:auto; padding:6px 10px; font-size:14px; font-weight:500; }
  input, select { font:inherit; width:100%; padding:10px; border-radius:8px; border:1px solid var(--border); background:var(--bg); color:var(--text); margin:4px 0 10px; }
  select.missing { border-color:var(--err); }
  label { font-size:13px; color:var(--muted); display:block; }
  label .req { color:var(--err); }
  .two { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .manual { display:flex; gap:8px; margin-top:10px; }
  .manual input { margin:0; }
  .manual button { width:auto; white-space:nowrap; }
  #status { font-size:15px; min-height:22px; margin-top:10px; }
  .ok { color:var(--accent); } .bad { color:var(--err); }
  ul { list-style:none; padding:0; margin:0; }
  li { padding:8px 0; border-bottom:1px solid var(--border); font-size:14px; display:flex; justify-content:space-between; gap:8px; word-break:break-all; }
  li:last-child { border-bottom:0; }
  li small { color:var(--muted); text-align:right; }
  .hidden { display:none; }
  #person { border-radius:12px; padding:14px; margin-top:10px; border:2px solid var(--border); }
  #person.found { border-color:var(--accent); }
  #person.notfound { border-color:var(--err); }
  #person .pname { font-size:22px; font-weight:700; line-height:1.3; }
  #person .ptroop { font-size:17px; margin-top:4px; }
  #person .pid { font-size:13px; color:var(--muted); margin-top:6px; font-variant-numeric:tabular-nums; }
  #person.notfound .pname { color:var(--err); }
</style>
</head>
<body>
<main>
  <h1>Training Form <button class="ghost" id="toggleSettings">Settings</button></h1>

  <div class="card hidden" id="settings">
    <label>Apps Script Web App URL</label>
    <input id="url" placeholder="https://script.google.com/macros/s/.../exec">
    <label>Secret (only if set in the script)</label>
    <input id="secret" type="password">
    <button id="save">Save</button>
  </div>

  <div class="card">
    <label>Training course <span class="req">*</span></label>
    <select id="course"></select>
    <div class="two">
      <div>
        <label>Day <span class="req">*</span></label>
        <select id="day"></select>
      </div>
      <div>
        <label>Note</label>
        <select id="note"></select>
      </div>
    </div>
    <div id="reader"></div>
    <button id="startBtn" style="margin-top:10px">Start scanning</button>
    <div class="manual">
      <input id="manualId" inputmode="numeric" placeholder="Or type ID manually">
      <button class="ghost" id="manualBtn">Submit</button>
    </div>
    <div id="status"></div>
    <div id="person" class="hidden" dir="auto">
      <div class="pname" id="pName"></div>
      <div class="ptroop" id="pTroop"></div>
      <div class="pid" id="pId"></div>
    </div>
  </div>

  <div class="card">
    <strong>Recent scans</strong> <small id="queueInfo" style="color:var(--muted)"></small>
    <ul id="log"></ul>
  </div>
</main>

<script>
// ---- Form structure (from Training_Form.sto) ----
const FORM = {
  courses: ['First Aid', 'Treasury', 'Leaders Academy Level 1', 'Leaders Academy Level 2', 'Safe From Harm', 'Safety'],
  days: ['Day 1','Day 2','Day 3','Day 4','Day 5','Day 6','Day 7','Day 8','Construction','Practical Skills','Degla','Same City Discovery','Other City Discovery'],
  notes: ['Check in', 'Check out', 'Check In Late', 'Check out Early']
};
// Paste your Apps Script /exec URL here to hardcode it for everyone, or enter it in Settings.
const DEFAULT_URL = '';

const $ = id => document.getElementById(id);
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
};

let cfg = store.get('cfg', { url: DEFAULT_URL, secret: '' });
if (!cfg.url && DEFAULT_URL) cfg.url = DEFAULT_URL;
let queue = store.get('queue', []);
let lastCode = '', lastTime = 0, scanner = null, running = false;

function fill(sel, list, placeholder, keep) {
  const cur = keep ?? sel.value;
  sel.innerHTML = '';
  const ph = document.createElement('option'); ph.value = ''; ph.textContent = placeholder; sel.appendChild(ph);
  list.forEach(v => { const o = document.createElement('option'); o.value = o.textContent = v; sel.appendChild(o); });
  if (cur && list.includes(cur)) sel.value = cur;
}

// Training course + Day: required, remembered. Note: optional, resets after each scan.
fill($('course'), FORM.courses, '— Select —', store.get('course', ''));
fill($('day'), FORM.days, '— Select —', store.get('day', ''));
fill($('note'), FORM.notes, '—', '');
$('course').onchange = () => { store.set('course', $('course').value); $('course').classList.remove('missing'); };
$('day').onchange = () => { store.set('day', $('day').value); $('day').classList.remove('missing'); };

$('url').value = cfg.url || ''; $('secret').value = cfg.secret || '';
if (!cfg.url) $('settings').classList.remove('hidden');
$('toggleSettings').onclick = () => $('settings').classList.toggle('hidden');
$('save').onclick = () => {
  cfg = { url: $('url').value.trim(), secret: $('secret').value };
  store.set('cfg', cfg);
  $('settings').classList.add('hidden');
  setStatus('Settings saved', true);
  flush();
};

function setStatus(msg, ok) { $('status').textContent = msg; $('status').className = ok ? 'ok' : 'bad'; }
function addLog(item, state) {
  const li = document.createElement('li');
  li.innerHTML = '<span></span><small></small>';
  li.children[0].textContent = item.name ? `${item.name}${item.troop ? ' · Troop ' + item.troop : ''}` : item.code;
  li.children[1].textContent = [item.course, item.day, item.note, new Date(item.ts).toLocaleTimeString(), state].filter(Boolean).join(' · ');
  $('log').prepend(li);
  while ($('log').children.length > 20) $('log').lastChild.remove();
}
function updateQueueInfo() { $('queueInfo').textContent = queue.length ? `(${queue.length} waiting to send)` : ''; }

async function send(item) {
  const res = await fetch(cfg.url, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' }, // avoids CORS preflight
    body: JSON.stringify(item)
  });
  const data = await res.json();
  if (!data.ok) throw new Error(data.error || 'Server error');
  return data;
}

async function flush() {
  if (!cfg.url) return;
  while (queue.length) {
    try { await send(queue[0]); queue.shift(); store.set('queue', queue); }
    catch { break; }
  }
  updateQueueInfo();
}

function showPerson(code, data) {
  const box = $('person');
  box.classList.remove('hidden', 'found', 'notfound');
  if (data && data.person) {
    box.classList.add('found');
    $('pName').textContent = data.person.name || '(no name)';
    $('pTroop').textContent = data.person.troop ? 'Troop ' + data.person.troop : '';
  } else if (data && data.lookupError) {
    $('pName').textContent = 'Saved — lookup error';
    $('pTroop').textContent = data.lookupError;
  } else if (data) {
    box.classList.add('notfound');
    $('pName').textContent = 'Not found in list';
    $('pTroop').textContent = 'Scan was saved anyway';
  } else {
    $('pName').textContent = 'Offline — queued';
    $('pTroop').textContent = 'Name will not show for this scan';
  }
  $('pId').textContent = 'ID ' + code;
}

async function submit(code) {
  code = String(code).trim();
  if (!code) return;
  const now = Date.now();
  if (code === lastCode && now - lastTime < 3000) return; // ignore repeat reads of same code
  if (!cfg.url) { setStatus('Add your Apps Script URL in Settings first', false); return; }
  const missing = ['course', 'day'].filter(k => !$(k).value);
  if (missing.length) {
    missing.forEach(k => $(k).classList.add('missing'));
    setStatus('Select Training course and Day first', false); return;
  }
  lastCode = code; lastTime = now;
  if (navigator.vibrate) navigator.vibrate(80);

  const item = { code, ts: now, course: $('course').value, day: $('day').value, note: $('note').value, secret: cfg.secret };
  $('note').value = ''; // Note does not remember its value (per form)
  setStatus('Sending…', true);
  try {
    const data = await send(item);
    setStatus('✓ Saved', true);
    if (data.person) { item.name = data.person.name; item.troop = data.person.troop; }
    showPerson(code, data);
    addLog(item, data.person ? 'saved' : (data.lookupError ? 'saved' : 'saved · not in list'));
  } catch (e) {
    if (/required|Missing|secret/i.test(e.message)) { setStatus('Rejected: ' + e.message, false); return; }
    queue.push(item); store.set('queue', queue); updateQueueInfo();
    showPerson(code, null);
    setStatus('Offline or error — queued, will retry', false);
    addLog(item, 'queued');
  }
}

$('manualBtn').onclick = () => { submit($('manualId').value); $('manualId').value = ''; };
$('manualId').onkeydown = e => { if (e.key === 'Enter') $('manualBtn').click(); };

$('startBtn').onclick = async () => {
  if (running) {
    await scanner.stop(); running = false;
    $('startBtn').textContent = 'Start scanning'; return;
  }
  scanner = scanner || new Html5Qrcode('reader'); // reads QR codes and common barcodes
  try {
    await scanner.start({ facingMode: 'environment' }, { fps: 10, qrbox: { width: 250, height: 250 } }, submit);
    running = true; $('startBtn').textContent = 'Stop';
    setStatus('Point the camera at a code', true);
  } catch (e) {
    setStatus('Camera error: ' + e + ' (page must be on https and camera allowed)', false);
  }
};

updateQueueInfo();
setInterval(flush, 15000);
window.addEventListener('online', flush);
</script>
</body>
</html>
