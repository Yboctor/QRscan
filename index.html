<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Training Form</title>
<script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
  :root { --bg:#f5f6f8; --card:#fff; --text:#1a1d21; --muted:#6b7280; --accent:#1a7f5a; --err:#c0392b; --border:#e3e5e8; }
  @media (prefers-color-scheme: dark) { :root { --bg:#111315; --card:#1b1e21; --text:#eceef0; --muted:#9aa1a9; --border:#2c3035; } }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,-apple-system,sans-serif; background:var(--bg); color:var(--text); }
  main { max-width:520px; margin:0 auto; padding:16px; }
  h1 { font-size:20px; margin:4px 0 12px; display:flex; justify-content:space-between; align-items:center; gap:8px; }
  .card { background:var(--card); border:1px solid var(--border); border-radius:14px; padding:14px; margin-bottom:12px; }
  #reader { width:100%; border-radius:10px; overflow:hidden; }
  button { font:inherit; border:0; border-radius:10px; padding:12px 16px; background:var(--accent); color:#fff; font-weight:600; width:100%; }
  button.ghost { background:transparent; color:var(--muted); border:1px solid var(--border); width:auto; padding:6px 10px; font-size:14px; font-weight:500; }
  input, select { font:inherit; width:100%; padding:10px; border-radius:8px; border:1px solid var(--border); background:var(--bg); color:var(--text); margin:4px 0 10px; }
  select.missing { border-color:var(--err); }
  label { font-size:13px; color:var(--muted); display:block; }
  label .req { color:var(--err); }
  .two { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .manual { display:flex; gap:8px; margin-top:10px; }
  .manual input { margin:0; }
  .manual button { width:auto; white-space:nowrap; }
  #status { font-size:15px; min-height:22px; margin-top:10px; }
  .ok { color:var(--accent); } .bad { color:var(--err); }
  ul { list-style:none; padding:0; margin:0; }
  li { padding:8px 0; border-bottom:1px solid var(--border); font-size:14px; display:flex; justify-content:space-between; gap:8px; word-break:break-all; }
  li:last-child { border-bottom:0; }
  li small { color:var(--muted); text-align:right; }
  .hidden { display:none; }
  .cover { display:block; width:100%; height:auto; border-radius:14px; margin:0 0 12px; background:var(--border); }
  #person { border-radius:12px; padding:14px; margin-top:10px; border:2px solid var(--border); }
  #person.found { border-color:var(--accent); }
  #person.notfound { border-color:var(--err); }
  #person .pname { font-size:22px; font-weight:700; line-height:1.3; }
  #person .ptroop { font-size:17px; margin-top:4px; }
  #person .pid { font-size:13px; color:var(--muted); margin-top:6px; font-variant-numeric:tabular-nums; }
  #person.notfound .pname { color:var(--err); }
  #person.dup { border-color:#d97706; }
  #person.dup .pname { color:#d97706; }
</style>
</head>
<body>
<main>
  <img class="cover" src="https://i.postimg.cc/5NGY20KY/cover-train.jpg" alt="Training" onerror="this.remove()">
  <h1>Training Form <button class="ghost" id="toggleSettings">Settings</button></h1>

  <div class="card hidden" id="settings">
    <div id="urlBox">
      <label>Apps Script Web App URL</label>
      <input id="url" placeholder="https://script.google.com/macros/s/.../exec">
    </div>
    <label>Secret</label>
    <input id="secret" type="password">
    <button id="save">Save</button>
  </div>

  <div class="card">
    <label>Training course <span class="req">*</span></label>
    <select id="course"></select>
    <div class="two">
      <div>
        <label>Day <span class="req">*</span></label>
        <select id="day"></select>
      </div>
      <div>
        <label>Note</label>
        <select id="note"></select>
      </div>
    </div>
    <div id="reader"></div>
    <button id="startBtn" style="margin-top:10px">Start scanning</button>
    <div class="manual">
      <input id="manualId" inputmode="numeric" placeholder="Or type ID manually">
      <button class="ghost" id="manualBtn">Submit</button>
    </div>
    <div id="status"></div>
    <div style="font-size:13px;color:var(--muted);margin-top:6px;display:flex;justify-content:space-between;align-items:center">
      <span id="peopleInfo">Names list: not loaded</span>
      <button class="link" id="reloadPeople" style="background:none;border:0;color:var(--accent);padding:0;width:auto;font-size:13px;font-weight:600">↻ Update names</button>
    </div>
    <div id="person" class="hidden" dir="auto">
      <div class="pname" id="pName"></div>
      <div class="ptroop" id="pTroop"></div>
      <div class="pid" id="pId"></div>
    </div>
  </div>

  <div class="card">
    <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap">
      <div><strong>Recent scans</strong> <small id="queueInfo" style="color:var(--muted)"></small></div>
      <div id="queueBtns" style="display:none;gap:6px">
        <button class="ghost" id="retryBtn">↻ Retry now</button>
        <button class="ghost" id="clearBtn" style="color:var(--err)">Clear unsaved</button>
      </div>
    </div>
    <ul id="log"></ul>
  </div>
</main>

<script>
// ---- Form structure (from Training_Form.sto) ----
const FORM = {
  courses: ['First Aid', 'Treasury', 'Leaders Academy Level 1', 'Leaders Academy Level 2', 'Safe From Harm', 'Safety'],
  days: ['Day 1','Day 2','Day 3','Day 4','Day 5','Day 6','Day 7','Day 8','Construction','Practical Skills','Degla','Same City Discovery','Other City Discovery'],
  notes: ['Check in', 'Check out', 'Check In Late', 'Check out Early']
};
// Paste your Apps Script /exec URL here to hardcode it for everyone, or enter it in Settings.
const DEFAULT_URL = 'https://script.google.com/macros/s/AKfycbwpayrgMeoreDgW_AxhiRim-rIeGBVDjb7MnNggPAA0au5qetGmnPY_VxUoWIwEdY5rMw/exec';
const PEOPLE_MAX_AGE = 6 * 60 * 60 * 1000; // re-download the names list if older than 6 hours
const DUP_WINDOW = 10 * 60 * 1000;           // same ID can't be scanned again within 10 minutes

const $ = id => document.getElementById(id);
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch { return false; } }
};

let cfg = store.get('cfg', { url: DEFAULT_URL, secret: '' });
if (DEFAULT_URL) cfg.url = DEFAULT_URL; // built-in URL always wins
let queue = store.get('queue', []);
// ID -> time of last accepted scan on this phone (for the 10-minute rule)
let recent = store.get('recent', {});
function pruneRecent() { const cut = Date.now() - DUP_WINDOW; for (const k in recent) if (recent[k] < cut) delete recent[k]; store.set('recent', recent); }
pruneRecent();
let lastCode = '', lastTime = 0, scanner = null, running = false, flushing = false, shownCode = '';

// ---- Names cache (ID -> [name, group]) kept on this phone ----
const normId = v => String(v).replace(/\s+/g, '').replace(/\.0+$/, '');
let people = new Map();
let peopleMeta = store.get('peopleMeta', { at: 0, count: 0 });
(store.get('people', []) || []).forEach(([id, n, t]) => people.set(id, [n, t]));
function updatePeopleInfo(msg) {
  $('peopleInfo').textContent = msg || (people.size
    ? `Names list: ${people.size} people · updated ${new Date(peopleMeta.at).toLocaleString([], {dateStyle:'short', timeStyle:'short'})}`
    : 'Names list: not loaded');
}
async function loadPeople(force) {
  if (!cfg.url) return;
  if (!force && people.size && Date.now() - peopleMeta.at < PEOPLE_MAX_AGE) return;
  updatePeopleInfo('Names list: downloading…');
  try {
    const u = new URL(cfg.url); u.searchParams.set('action', 'people');
    if (cfg.secret) u.searchParams.set('secret', cfg.secret);
    const r = await fetchT(u, {}, 60000);
    const txt = await r.text();
    let data; try { data = JSON.parse(txt); } catch { throw new Error('Script error (HTTP ' + r.status + ')'); }
    if (!data.ok) { if (/secret/i.test(data.error || '')) askSecret('Wrong or missing secret — enter it in Settings'); throw new Error(data.error || 'error'); }
    people = new Map(data.people.map(([id, n, t]) => [normId(id), [n, t]]));
    peopleMeta = { at: Date.now(), count: people.size };
    store.set('people', data.people.map(([id, n, t]) => [normId(id), n, t]));
    store.set('peopleMeta', peopleMeta);
    updatePeopleInfo();
  } catch (e) {
    updatePeopleInfo(people.size ? undefined : 'Names list: could not download (' + e.message + ')');
  }
}
$('reloadPeople').onclick = () => loadPeople(true);

function fill(sel, list, placeholder, keep) {
  const cur = keep ?? sel.value;
  sel.innerHTML = '';
  const ph = document.createElement('option'); ph.value = ''; ph.textContent = placeholder; sel.appendChild(ph);
  list.forEach(v => { const o = document.createElement('option'); o.value = o.textContent = v; sel.appendChild(o); });
  if (cur && list.includes(cur)) sel.value = cur;
}

// Training course + Day: required, remembered. Note: optional, resets after each scan.
fill($('course'), FORM.courses, '— Select —', store.get('course', ''));
fill($('day'), FORM.days, '— Select —', store.get('day', ''));
fill($('note'), FORM.notes, '—', '');
$('course').onchange = () => { store.set('course', $('course').value); $('course').classList.remove('missing'); };
$('day').onchange = () => { store.set('day', $('day').value); $('day').classList.remove('missing'); };

$('url').value = cfg.url || ''; $('secret').value = cfg.secret || '';
if (DEFAULT_URL) $('urlBox').classList.add('hidden');
function askSecret(msg) {
  $('settings').classList.remove('hidden');
  $('secret').focus();
  setStatus(msg || 'Enter the secret in Settings', false);
}
if (!cfg.url) $('settings').classList.remove('hidden');
else if (!cfg.secret) askSecret('Enter the secret in Settings, then Save');
$('toggleSettings').onclick = () => $('settings').classList.toggle('hidden');
$('save').onclick = () => {
  cfg = { url: DEFAULT_URL || $('url').value.trim(), secret: $('secret').value.trim() };
  store.set('cfg', cfg);
  $('settings').classList.add('hidden');
  setStatus('Settings saved', true);
  loadPeople(true); flush();
};

function setStatus(msg, ok) { $('status').textContent = msg; $('status').className = ok ? 'ok' : 'bad'; }
function updateQueueInfo() {
  $('queueInfo').textContent = queue.length ? `(${queue.length} not saved yet)` : '';
  $('queueBtns').style.display = queue.length ? 'flex' : 'none';
}

// Recent scans list; each entry updates its own state as it saves.
function addLog(item) {
  const li = document.createElement('li');
  li.dataset.ts = item.ts;
  li.innerHTML = '<span></span><small></small>';
  $('log').prepend(li);
  while ($('log').children.length > 30) $('log').lastChild.remove();
  renderLog(item, 'saving…');
}
function renderLog(item, state) {
  const li = $('log').querySelector(`li[data-ts="${item.ts}"]`);
  if (!li) return;
  li.children[0].textContent = item.name ? `${item.name}${item.troop ? ' · ' + item.troop : ''}` : item.code;
  li.children[1].textContent = [item.course, item.day, item.note, new Date(item.ts).toLocaleTimeString(), state].filter(Boolean).join(' · ');
  li.children[1].style.color = state === 'saved ✓' ? 'var(--accent)' : '';
}

function showPerson(code, person, pending, dupAt) {
  const box = $('person');
  shownCode = code;
  box.classList.remove('hidden', 'found', 'notfound', 'dup');
  if (dupAt) {
    box.classList.add('dup');
    const mins = Math.max(0, Math.round((Date.now() - dupAt) / 60000));
    $('pName').textContent = 'Already scanned ' + (mins < 1 ? 'just now' : mins + ' min ago');
    $('pTroop').textContent = (person && person.name ? person.name + (person.troop ? ' · ' + person.troop : '') + ' — ' : '') + 'not saved again';
  } else if (person) {
    box.classList.add('found');
    $('pName').textContent = person.name || '(no name)';
    $('pTroop').textContent = person.troop || '';
  } else if (pending) {
    $('pName').textContent = 'Looking up…';
    $('pTroop').textContent = '';
  } else {
    box.classList.add('notfound');
    $('pName').textContent = 'Not found in list';
    $('pTroop').textContent = 'Scan is saved anyway';
  }
  $('pId').textContent = 'ID ' + code;
}

// fetch that gives up after 30 s so one stuck request can't block the queue forever
async function fetchT(url, opts = {}, ms = 30000) {
  const ctrl = new AbortController();
  const t = setTimeout(() => ctrl.abort(), ms);
  try { return await fetch(url, { ...opts, signal: ctrl.signal }); }
  catch (e) { throw new Error(e.name === 'AbortError' ? 'no answer after 30 s' : 'no connection'); }
  finally { clearTimeout(t); }
}

async function send(item) {
  const { name, troop, ...payload } = item;
  const res = await fetchT(cfg.url, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' }, // avoids CORS preflight
    body: JSON.stringify({ ...payload, secret: cfg.secret })
  });
  const txt = await res.text();
  let data;
  try { data = JSON.parse(txt); }
  catch { const m = txt.match(/<title>([^<]*)<\/title>/i) || txt.match(/Error[^<]{0,120}/); throw new Error('Script error: ' + (m ? (m[1] || m[0]) : 'HTTP ' + res.status)); }
  if (!data.ok) { const err = new Error(data.error || 'Server error'); err.fatal = /required|Missing|secret/i.test(err.message); throw err; }
  return data;
}

// Sends queued scans one by one in the background.
async function flush() {
  if (!cfg.url || flushing) return;
  flushing = true;
  try {
    while (queue.length) {
      const item = queue[0];
      if (!item) break;
      try {
        const data = await send(item);
        if (data.duplicate) {
          // Another phone scanned this ID within 10 minutes
          recent[item.code] = data.lastAt || item.ts; store.set('recent', recent);
          renderLog(item, 'duplicate — not saved');
          if (shownCode === item.code) showPerson(item.code, item.name ? { name: item.name, troop: item.troop } : (data.person || null), false, data.lastAt || item.ts);
          queue = queue.filter(x => x !== item); store.set('queue', queue);
          continue;
        }
        if (item.skipLookup !== true) {
          // Name wasn't in the phone's list: use the server's answer.
          if (data.person) { item.name = data.person.name; item.troop = data.person.troop; }
          if (shownCode === item.code) showPerson(item.code, data.person || null, false);
        }
        renderLog(item, 'saved ✓');
        queue = queue.filter(x => x !== item); store.set('queue', queue);
      } catch (e) {
        if (/secret/i.test(e.message)) { renderLog(item, 'waiting — wrong secret'); askSecret('Wrong or missing secret — scans are kept, enter it in Settings'); break; }
        if (e.fatal) { renderLog(item, 'rejected: ' + e.message); setStatus('Rejected: ' + e.message, false); queue = queue.filter(x => x !== item); store.set('queue', queue); continue; }
        const why = (e && e.message) || 'no connection';
        renderLog(item, 'not saved yet — ' + why);
        setStatus('Not saved yet: ' + why + ' (retrying every 15 s)', false);
        break;
      } finally { updateQueueInfo(); }
    }
  } finally { flushing = false; }
}

function submit(code) {
  code = normId(code);
  if (!code) return;
  const now = Date.now();
  if (code === lastCode && now - lastTime < 3000) return; // camera re-reading the same code
  if (!cfg.url) { setStatus('Add your Apps Script URL in Settings first', false); return; }
  const missing = ['course', 'day'].filter(k => !$(k).value);
  if (missing.length) {
    missing.forEach(k => $(k).classList.add('missing'));
    setStatus('Select Training course and Day first', false); return;
  }
  lastCode = code; lastTime = now;
  const hit = people.get(code);

  // 10-minute duplicate rule (this phone)
  if (recent[code] && now - recent[code] < DUP_WINDOW) {
    if (navigator.vibrate) navigator.vibrate([60, 60, 60]);
    showPerson(code, hit ? { name: hit[0], troop: hit[1] } : null, false, recent[code]);
    setStatus('Duplicate — not saved', false);
    return;
  }
  recent[code] = now; store.set('recent', recent);
  if (navigator.vibrate) navigator.vibrate(80);

  const item = { code, ts: now, course: $('course').value, day: $('day').value, note: $('note').value, skipLookup: !!hit };
  if (hit) { item.name = hit[0]; item.troop = hit[1]; }
  $('note').value = ''; // Note does not remember its value (per form)

  // Show instantly from the phone's list; save in background.
  showPerson(code, hit ? { name: hit[0], troop: hit[1] } : null, !hit);
  setStatus('✓ Scanned', true);
  addLog(item);
  queue.push(item); store.set('queue', queue); updateQueueInfo();
  flush();
}

$('retryBtn').onclick = () => { if (flushing) { setStatus('Already trying — wait a few seconds', true); return; } setStatus('Retrying…', true); flush(); };
$('clearBtn').onclick = () => {
  if (!queue.length) return;
  if (!window.confirm(`Delete ${queue.length} scan(s) that were NOT saved to the sheet?`)) return;
  queue.forEach(it => { renderLog(it, 'cleared — not saved'); delete recent[it.code]; });
  queue = []; store.set('queue', queue); store.set('recent', recent);
  updateQueueInfo(); setStatus('Unsaved scans cleared', true);
};
$('manualBtn').onclick = () => { submit($('manualId').value); $('manualId').value = ''; };
$('manualId').onkeydown = e => { if (e.key === 'Enter') $('manualBtn').click(); };

$('startBtn').onclick = async () => {
  if (running) {
    await scanner.stop(); running = false;
    $('startBtn').textContent = 'Start scanning'; return;
  }
  scanner = scanner || new Html5Qrcode('reader'); // reads QR codes and common barcodes
  try {
    await scanner.start({ facingMode: 'environment' }, { fps: 10, qrbox: { width: 250, height: 250 } }, submit);
    running = true; $('startBtn').textContent = 'Stop';
    setStatus('Point the camera at a code', true);
  } catch (e) {
    setStatus('Camera error: ' + e + ' (page must be on https and camera allowed)', false);
  }
};

// Show queued-from-last-time items in the log
queue.forEach(it => { addLog(it); renderLog(it, 'waiting to save'); });
updateQueueInfo();
updatePeopleInfo();
loadPeople(false);
flush();
setInterval(flush, 15000);
window.addEventListener('online', flush);
</script>
</body>
</html>
